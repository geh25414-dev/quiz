<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知識封鎖戰：房間對戰版</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root { --player-a: #3498db; --player-b: #e74c3c; --wall: #2c3e50; --cell-size: 60px; }
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f4f4f9; padding: 20px; }
        
        /* 確保隱藏標籤絕對生效 */
        .hidden { display: none !important; }
        
        #setup-screen { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; }
        .card { background: #f9f9f9; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #eee; }
        input { padding: 10px; font-size: 16px; width: 80%; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; text-align: center; }
        
        #grid { display: grid; gap: 5px; margin: 20px auto; background: #ddd; padding: 5px; border-radius: 4px; }
        .cell { width: var(--cell-size); height: var(--cell-size); background: white; display: flex; align-items: center; justify-content: center; font-size: 12px; border: 1px solid #ccc; transition: 0.3s; }
        .cell.start { background: #2ecc71; color: white; }
        .cell.end { background: #f1c40f; color: white; }
        .cell.path { background: var(--player-a); color: white; }
        .cell.wall { background: var(--wall); color: white; }
        .cell.selectable { border: 3px solid var(--player-a); cursor: pointer; animation: pulse 1.5s infinite; }
	.cell.challenging { 
   	 background: #ffecb3 !important; /* 淺橘色背景 */
    	border: 3px dashed #f39c12 !important; /* 虛線邊框 */
    	animation: flash 1s infinite;
	}

	@keyframes flash {
   	 0% { opacity: 1; }
   	 50% { opacity: 0.6; }
   	 100% { opacity: 1; }
	}        

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(0.95); } 100% { transform: scale(1); } }
        
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px; background: #34495e; color: white; margin: 5px; transition: 0.3s; }
        button:hover { background: #2c3e50; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        #quiz-container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; margin-top: 20px; text-align: center; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .timer { font-size: 24px; color: #e74c3c; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h1>知識封鎖戰</h1>
        <div class="card">
            <h3>創建新遊戲</h3>
            <p>選擇地圖大小：</p>
            <select id="map-size-select" style="padding: 5px; margin-bottom: 10px;">
                <option value="5">5 x 5</option>
                <option value="6">6 x 6</option>
                <option value="7">7 x 7</option>
            </select><br>
            <button style="background:#27ae60" onclick="createRoom()">創建房間 (擔任 A)</button>
        </div>
        <div class="card">
            <h3>加入現有遊戲</h3>
            <input type="text" id="join-room-id" placeholder="輸入 6 位房號">
            <button style="background:#2980b9" onclick="joinExistingRoom()">加入房間 (擔任 B)</button>
        </div>
    </div>

    <div id="game-screen" class="hidden">
        <h2 id="display-room-id">房間號：...</h2>
        <h4 id="role-text">你的角色：...</h4>
        <div id="status-msg">等待連線中...</div>
        
        <div id="grid"></div>

        <div id="quiz-container" class="hidden">
            <div class="timer">剩餘時間：<span id="time-left">60</span>s</div>
            <h3 id="question-text">題目載入中...</h3>
            
            <div id="buzzer-zone">
                <button style="width:100%; height: 60px; font-size: 20px; background: #e67e22;" onclick="sendBuzz()">點我搶答！</button>
            </div>
            
            <div id="options-zone" class="options">
                <button id="optA" onclick="sendAnswer('A')"></button>
                <button id="optB" onclick="sendAnswer('B')"></button>
                <button id="optC" onclick="sendAnswer('C')"></button>
                <button id="optD" onclick="sendAnswer('D')"></button>
            </div>
        </div>
    </div>

<script>

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const rawQuestions = [
        ["誰發明了電燈？", "牛頓", "愛迪生", "愛因斯坦", "特斯拉", "B"],
        ["台灣最高的山是什麼山？", "雪山", "阿里山", "玉山", "大霸尖山", "C"],

        ["奧運五環標誌中沒有哪種顏色？", "藍色", "黃色", "紫色", "黑色", "C"],

        ["請問美國的現任首都在哪？", "紐約", "洛杉磯", "華盛頓", "芝加哥", "C"],
        ["人體共有多少塊骨頭？", "106", "206", "306", "406", "B"],
        ["哪一個行星有明顯的環環繞？", "火星", "天王星", "土星", "冥王星", "C"],
        ["『哈利波特』的作者是？", "金庸", "JK羅琳", "托爾金", "馬克吐溫", "B"],
        ["聲音在什麼介質中傳播最快？", "真空", "空氣", "水", "鋼鐵", "D"],
        ["蜜蜂傳遞訊息主要是透過？", "叫聲", "觸角", "舞蹈", "氣味", "C"],
        ["世界上面積最大的國家是？", "中國", "美國", "俄羅斯", "加拿大", "C"],
        ["請問一小時有多少秒？", "60秒", "600秒", "3600秒", "36000秒", "C"],
        ["哪一個器官負責過濾血液產生尿液？", "心臟", "肝臟", "腎臟", "脾臟", "C"],
        ["『西遊記』中誰會七十二變？", "豬八戒", "沙悟淨", "孫悟空", "唐三藏", "C"],
        ["奧運會每隔幾年舉辦一次？", "2年", "3年", "4年", "5年", "C"],
        ["企鵝生活在地球的哪一端？", "北極", "南極", "赤道", "東極", "B"],
        ["紙是誰發明的？", "張衡", "祖沖之", "蔡倫", "畢昇", "C"],
        ["鋼琴有多少個鍵？", "76", "88", "92", "104", "B"],
        ["下列哪種植物是沙漠中最常見的？", "玫瑰", "仙人掌", "向日葵", "康乃馨", "B"],
        ["請問『文房四寶』不包括哪一項？", "筆", "墨", "紙", "書", "D"],
        ["地球自轉一圈大約需要多久？", "一小時", "一天", "一個月", "一年", "B"]
    ];

    let myRole = null, roomID = null, gridData = [], timerInterval = null, mapSize = 5;

    function createRoom() {
        mapSize = parseInt(document.getElementById('map-size-select').value);
        roomID = Math.floor(100000 + Math.random() * 900000).toString();
        myRole = 'A';
        const total = mapSize * mapSize;
        const initialGrid = Array(total).fill('empty');
        initialGrid[0] = 'start'; 
        initialGrid[total - 1] = 'end';

        db.ref('rooms/' + roomID).set({
            grid: initialGrid,
            mapSize: mapSize,
            turn: 'WAITING',
            status: '等待對手加入...',
            gameStarted: false,
            quiz: null,
            buzzer: null,
            timeLeft: 60
        }).then(() => enterGame());
    }

    function joinExistingRoom() {
        const id = document.getElementById('join-room-id').value;
        if (!id) return alert("請輸入房號");
        db.ref('rooms/' + id).once('value', snap => {
            if (snap.exists()) {
                roomID = id; myRole = 'B';
                db.ref('rooms/' + roomID).update({ 
                    status: '遊戲開始！A 請選擇格子', 
                    turn: 'A', 
                    gameStarted: true 
                });
                enterGame();
            } else { alert("找不到房間！"); }
        });
    }

    function enterGame() {
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('display-room-id').innerText = "房間號：" + roomID;
        document.getElementById('role-text').innerText = "角色：" + (myRole === 'A' ? "開拓者(A)" : "阻擋者(B)");
        listenToRoom();
    }

    function listenToRoom() {
        db.ref('rooms/' + roomID).on('value', snap => {
            const data = snap.val();
            if(!data) return;
            gridData = data.grid;
            mapSize = data.mapSize || 5;
            renderGrid(data.grid, data.turn, data.gameStarted,data.challengingIdx);
            handleQuiz(data);
            document.getElementById('status-msg').innerText = data.status;
            
            const timerSpan = document.getElementById('time-left');
            if (data.turn === 'QUIZ' && timerSpan) {
                timerSpan.innerText = data.timeLeft !== undefined ? data.timeLeft : 60;
            }
        });
    }

    function renderGrid(grid, turn, gameStarted,challengingIdx) {
        const gridEl = document.getElementById('grid');
        if (!gameStarted) {
            gridEl.innerHTML = '<p style="padding: 20px;">等待對手加入...</p>';
            return;
        }
        gridEl.style.display = 'grid';
        gridEl.style.gridTemplateColumns = `repeat(${mapSize}, 60px)`;
        gridEl.innerHTML = '';

        let selectables = [];
        if (turn === 'A' && myRole === 'A') {
            grid.forEach((type, i) => {
                if (type === 'start' || type === 'path') {
                    getNeighbors(i).forEach(n => {
                        if (grid[n] !== 'start' && grid[n] !== 'path' && grid[n] !== 'wall') selectables.push(n);
                    });
                }
            });
        }

        grid.forEach((type, i) => {
            const cell = document.createElement('div');
            cell.className = `cell ${type === 'empty' ? '' : type}`;
	    if (challengingIdx !== undefined && challengingIdx === i) {
            	cell.classList.add('challenging');
            }
            if (i === 0) cell.innerText = "起點";
            if (i === grid.length - 1) cell.innerText = "終點";
            if (selectables.includes(i)) {
                cell.classList.add('selectable');
                cell.onclick = () => selectCell(i);
            }
            gridEl.appendChild(cell);
        });
    }


    function selectCell(idx) {
        db.ref('rooms/' + roomID).update({
            turn: 'QUIZ',
            quiz: { selectedIdx: idx, qIdx: Math.floor(Math.random() * rawQuestions.length) },
	    challengingIdx: idx,
            buzzer: null,
            failedPlayers: null,
            status: '搶答開始！',
            timeLeft: 60
        });
        if (myRole === 'A') startSyncTimer();
    }

    function startSyncTimer() {
        clearInterval(timerInterval);
        let count = 60;
        timerInterval = setInterval(() => {
            count--;
            db.ref('rooms/' + roomID).update({ timeLeft: count });
            if (count <= 0) {
                clearInterval(timerInterval);
                db.ref('rooms/' + roomID).update({ turn: 'A', quiz: null, buzzer: null,challengingIdx: null, status: '時間到，換 A 重新選擇格子' });
            }
        }, 1000);
    }

function handleQuiz(data) {
        const container = document.getElementById('quiz-container');
        if (data.turn === 'QUIZ' && data.quiz) {
            container.classList.remove('hidden');
            const q = rawQuestions[data.quiz.qIdx];
            document.getElementById('question-text').innerText = q[0];
            
            const btns = [
                document.getElementById('optA'), 
                document.getElementById('optB'), 
                document.getElementById('optC'), 
                document.getElementById('optD')
            ];

            // 檢查是否有「搶答者」
            if (!data.buzzer) {
                // --- 尚未無人搶答 ---
                document.getElementById('buzzer-zone').style.display = 'block';
                btns.forEach((b, i) => {
                    b.innerText = String.fromCharCode(65 + i) + ": " + q[i+1];
                    b.disabled = true; // 沒搶答前不能按
                });
            } else {
                // --- 有人搶答了 ---
                document.getElementById('buzzer-zone').style.display = 'none';
                
                // 檢查是否有人已經答錯過（這題是否進入了「第二輪」）
                const hasSomeoneFailed = data.failedPlayers && data.failedPlayers.length > 0;
                
                btns.forEach((b, i) => {
                    if (hasSomeoneFailed) {
                        // 如果有人錯了，顯示選項文字（撿尾刀模式）
                        b.innerText = String.fromCharCode(65 + i) + ": " + q[i+1];
                    } else {
                        // 如果是第一個搶到的人，維持隱藏文字（高手挑戰模式）
                        b.innerText = String.fromCharCode(65 + i);
                    }

                    // 判斷作答權限
                    const amIFailed = data.failedPlayers && data.failedPlayers.includes(myRole);
                    b.disabled = (data.buzzer.player !== myRole || amIFailed);
                });
            }
        } else {
            container.classList.add('hidden');
        }
    }

    function sendBuzz() { db.ref('rooms/' + roomID + '/buzzer').set({ player: myRole }); }

    function sendAnswer(choice) {
        const roomRef = db.ref('rooms/' + roomID);
        roomRef.once('value', snap => {
            const data = snap.val();
            const correct = rawQuestions[data.quiz.qIdx][5];
            const winner = data.buzzer.player;
            const targetIdx = data.quiz.selectedIdx;
            let newGrid = [...data.grid];

            if (choice === correct) {
                newGrid[targetIdx] = (winner === 'A') ? (targetIdx === newGrid.length-1 ? 'end' : 'path') : 'wall';
                roomRef.update({ 
			grid: newGrid,
			turn: 'A',
			quiz: null,
			buzzer: null,
			status: winner + ' 答對了！',
			challengingIdx: null // 清空標記
		});
                checkGameOver(newGrid);
            } else {
                let failed = data.failedPlayers ? [...data.failedPlayers] : [];
                failed.push(winner);
                if (failed.length >= 2) {
                    roomRef.update({ turn: 'A', quiz: null, buzzer: null, failedPlayers: null, challengingIdx: null, status: '都答錯，換 A 重新選擇格子' });
                } else {
                    roomRef.update({ buzzer: { player: (winner==='A'?'B':'A') }, failedPlayers: failed, status: winner + ' 答錯，換人答' });
                }
            }
        });
    }


    function checkGameOver(grid) {
        // 獲取地圖大小 (假設你已經把 mapSize 存起來了)
        const size = mapSize || 5; 

        // 1. 檢查 A 是否贏了：起點 (0) 能否連到終點 (lastIdx)
        if (canReachEnd(grid, size)) {
            db.ref('rooms/' + roomID).update({ status: '遊戲結束：開拓者 A 獲勝！' });
            setTimeout(() => { alert("開拓者 A 獲勝！"); location.reload(); }, 500);
        } 
        // 2. 檢查 B 是否贏了：判斷 A 是否「還有可能」到達終點
        else if (isAPathCutOff(grid, size)) {
            db.ref('rooms/' + roomID).update({ status: '遊戲結束：阻擋者 B 獲勝！' });
            setTimeout(() => { alert("阻擋者 B 獲勝！路徑已被完全封鎖。"); location.reload(); }, 500);
        }
    }

    // 判斷 B 是否封鎖成功 (A 是否還有希望)
    function isAPathCutOff(grid, size) {
        const lastIdx = grid.length - 1;
        const queue = [0]; // 從起點開始找
        const visited = new Set([0]);

        while (queue.length > 0) {
            const curr = queue.shift();

            // 如果在搜尋過程中碰到了終點，代表路還沒斷
            if (curr === lastIdx) return false;

            const neighbors = getNeighbors(curr);
            for (let n of neighbors) {
                // A 可以藉由「自己的領地(path/start)」或是「尚未被佔領的空白格(empty)」繼續前進
                if (!visited.has(n) && (grid[n] === 'empty' || grid[n] === 'path' || grid[n] === 'start' || grid[n] === 'end')) {
                    visited.add(n);
                    queue.push(n);
                }
            }
        }

        // 如果走完了所有可能的路都碰不到終點，代表 B 獲勝！
        return true; 
    }



    function canReachEnd(grid) {
        const last = grid.length - 1;
        const q = [0], visited = new Set([0]);
        while (q.length > 0) {
            const curr = q.shift();
            if (curr === last) return true;
            getNeighbors(curr).forEach(n => {
                if (!visited.has(n) && (grid[n] === 'path' || grid[n] === 'end')) {
                    visited.add(n); q.push(n);
                }
            });
        }
        return false;
    }

    function isABlocked(grid) {
        const heads = [];
        grid.forEach((t, i) => { if(t === 'start' || t === 'path') heads.push(i); });
        const visited = new Set(heads), q = [...heads];
        while (q.length > 0) {
            const curr = q.shift();
            for (let n of getNeighbors(curr)) {
                if (grid[n] === 'empty' || grid[n] === 'end') return false;
                if (grid[n] === 'path' && !visited.has(n)) { visited.add(n); q.push(n); }
            }
        }
        return true;
    }

    function getNeighbors(i) {
        const n = [], r = Math.floor(i / mapSize), c = i % mapSize;
        if (r > 0) n.push(i - mapSize);
        if (r < mapSize - 1) n.push(i + mapSize);
        if (c > 0) n.push(i - 1);
        if (c < mapSize - 1) n.push(i + 1);
        return n;
    }
</script>
